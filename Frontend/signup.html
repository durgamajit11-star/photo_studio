<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudioSync | Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ================= CUSTOM CSS ================= -->
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --dark: #020617;
            --glass: rgba(255,255,255,0.12);
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background:
                linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.9)),
                url("assets/images/image.png");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* ===== GLASS CARD ===== */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* ===== CONTAINER ===== */
        .form-container {
            max-width: 640px;
            width: 100%;
            padding: 40px;
            animation: fadeUp 1s ease forwards;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 25px;
            text-align: center;
        }

        /* ===== ROLE SELECTION ===== */
        .role-selection {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 10px 22px;
            border-radius: 50px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(79,70,229,0.5);
        }

        /* ===== FORM ===== */
        .form-control, textarea {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }

        .form-control::placeholder,
        textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .form-control:focus,
        textarea:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--secondary);
            box-shadow: none;
            color: #fff;
        }

        /* ===== FILE UPLOAD ===== */
        .file-upload {
            border: 1px dashed rgba(255,255,255,0.3);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        /* ===== BUTTON ===== */
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            font-weight: 600;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6,182,212,0.4);
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 4px;
        }

        a {
            color: var(--secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media(max-width: 576px) {
            .form-container { padding: 30px 20px; }
        }
    </style>
</head>

<body>

    <!-- ================= SIGNUP CARD ================= -->
    <div class="form-container glass">
        <h2 class="text-center">Create Your Account 🚀</h2>
        <p class="subtitle">
            Join StudioSync as a user or register your studio
        </p>

        <!-- ROLE SELECTION -->
        <div class="role-selection">
            <button type="button" class="role-btn active" id="userRole">User</button>
            <button type="button" class="role-btn" id="studioRole">Studio</button>
        </div>

        <!-- ================= USER FORM ================= -->
        <form id="userForm" action="/signup/user" method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="fullName" placeholder="Full Name" required>
                <div class="error" id="userNameError"></div>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email address" required>
                <div class="error" id="userEmailError"></div>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password (min 8 chars)" required>
                <div class="error" id="userPasswordError"></div>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm password" required>
                <div class="error" id="userConfirmError"></div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" required>
                <label class="form-check-label">
                    I agree to the <a href="#">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Sign Up as User
            </button>
        </form>

        <!-- ================= STUDIO FORM ================= -->
        <form id="studioForm" class="d-none" action="/signup/studio" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <input type="text" class="form-control" name="studioName" placeholder="Studio Name" required>
                <div class="error" id="studioNameError"></div>
            </div>

            <div class="mb-3">
                <input type="text" class="form-control" name="ownerName" placeholder="Owner Full Name" required>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email address" required>
                <div class="error" id="studioEmailError"></div>
            </div>

            <div class="mb-3">
                <input type="tel" class="form-control" name="phone" placeholder="Phone Number" required>
            </div>

            <div class="mb-3">
                <textarea class="form-control" name="address" placeholder="Studio Address" rows="2" required></textarea>
            </div>

            <div class="mb-3">
                <textarea class="form-control" name="description" placeholder="Studio Description (optional)" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password (min 8 chars)" required>
                <div class="error" id="studioPasswordError"></div>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm password" required>
                <div class="error" id="studioConfirmError"></div>
            </div>

            <div class="file-upload">
                <label>Upload Business License (PDF/JPG/PNG)</label>
                <input type="file" name="license" accept=".pdf,.jpg,.png" required>
                <div class="error" id="licenseError"></div>
            </div>

            <div class="file-upload">
                <label>Upload Portfolio Sample (JPG/PNG)</label>
                <input type="file" name="portfolio" accept=".jpg,.png" required>
                <div class="error" id="portfolioError"></div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" required>
                <label class="form-check-label">
                    I agree to verification & <a href="#">Terms</a>
                </label>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Sign Up as Studio
            </button>

            <small class="d-block mt-2 text-center opacity-75">
                Studio accounts are verified within 24–48 hours.
            </small>
        </form>

        <p class="text-center mt-4">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ================= JS ================= -->
    <script>
        const userRole = document.getElementById('userRole');
        const studioRole = document.getElementById('studioRole');
        const userForm = document.getElementById('userForm');
        const studioForm = document.getElementById('studioForm');

        userRole.addEventListener('click', () => {
            userRole.classList.add('active');
            studioRole.classList.remove('active');
            userForm.classList.remove('d-none');
            studioForm.classList.add('d-none');
        });

        studioRole.addEventListener('click', () => {
            studioRole.classList.add('active');
            userRole.classList.remove('active');
            studioForm.classList.remove('d-none');
            userForm.classList.add('d-none');
        });
    </script>

</body>
</html>
