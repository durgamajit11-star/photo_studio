<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudioSync | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ================= CUSTOM CSS ================= -->
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --dark: #020617;
            --glass: rgba(255, 255, 255, 0.12);
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background:
                linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.9)),
                url("assets/images/image.png");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* ===== GLASS CARD ===== */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* ===== LOGIN CONTAINER ===== */
        .form-container {
            max-width: 480px;
            width: 100%;
            padding: 40px;
            animation: fadeUp 1s ease forwards;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        /* ===== ROLE SELECTION ===== */
        .role-selection {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 8px 18px;
            border-radius: 50px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(79,70,229,0.5);
        }

        /* ===== FORM ===== */
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--secondary);
            box-shadow: none;
            color: #fff;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            font-weight: 600;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6,182,212,0.4);
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
        }

        a {
            color: var(--secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= LOGIN CARD ================= -->
    <div class="form-container glass">
        <h2 class="text-center">Welcome Back 👋</h2>
        <p class="text-center subtitle">
            Login to access your StudioSync dashboard
        </p>

        <!-- ROLE SELECTION -->
        <div class="role-selection">
            <button type="button" class="role-btn active" id="userRole">User</button>
            <button type="button" class="role-btn" id="studioRole">Studio</button>
            <button type="button" class="role-btn" id="adminRole">Admin</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" action="/login" method="POST">
            <input type="hidden" name="role" id="roleInput" value="user">

            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email address" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
                <div class="error" id="passwordError"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-login w-100">Login</button>
        </form>

        <p class="text-center mt-4">
            Don’t have an account?
            <a href="signup.html">Create one</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ================= JS ================= -->
    <script>
        /* ROLE SELECTION */
        const roles = ['user', 'studio', 'admin'];
        roles.forEach(role => {
            document.getElementById(`${role}Role`).addEventListener('click', () => {
                document.getElementById('roleInput').value = role;
                roles.forEach(r =>
                    document.getElementById(`${r}Role`).classList.remove('active')
                );
                document.getElementById(`${role}Role`).classList.add('active');
            });
        });

        /* BASIC VALIDATION */
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            let valid = true;
            const email = document.querySelector('[name="email"]');
            const password = document.querySelector('[name="password"]');

            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                document.getElementById('emailError').textContent = 'Enter a valid email address.';
                valid = false;
            }

            if (password.value.trim() === '') {
                document.getElementById('passwordError').textContent = 'Password is required.';
                valid = false;
            }

            if (!valid) e.preventDefault();
        });
    </script>

</body>
</html>
