<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioSync | AI Recommendation Engine</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ================= GLOBAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s ease;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            position: relative;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar h2 {
            font-weight: 600;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -15px;
            background: #6366f1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sidebar a.active {
            background: linear-gradient(90deg, #6366f1, #06b6d4);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
            font-weight: 600;
        }


        /* ================= MAIN ================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ================= HEADER ================= */

        .header {
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .badge {
            background: #ef4444;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 12px;
        }

        .profile {
            cursor: pointer;
        }

        .dropdown {
            position: absolute;
            top: 70px;
            right: 30px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        /* ================= CONTENT ================= */

        .content {
            padding: 30px;
            flex: 1;
            overflow-y: auto;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h4 {
            margin-bottom: 10px;
        }

        /* ================= FILTERS ================= */

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        select,
        button {
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        button {
            background: linear-gradient(90deg, #6366f1, #06b6d4);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* ================= LOADER ================= */

        .loader {
            display: none;
            text-align: center;
            padding: 30px;
        }

        /* ================= RESULTS ================= */

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            height: 260px;
            border-radius: 18px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        }

        .card h4 {
            margin-bottom: 5px;
        }

        .location-badge {
            display: inline-block;
            background: #06b6d4;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
            margin-right: 5px;
        }

        .budget-high {
            background: #ef4444;
        }

        .budget-medium {
            background: #f59e0b;
        }

        .budget-low {
            background: #22c55e;
        }

        .rating {
            margin-top: 5px;
            font-weight: 600;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .rating {
            color: #06b6d4;
            margin-top: 10px;
        }

        /* ================= FOOTER ================= */

        .footer {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ================= ANIMATION ================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="toggle-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </div>
        <h2>StudioSync</h2>
        <a href="dashboards/user_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href=""><i class="bi bi-camera"></i> Portfolio</a>
        <a href="bookings/booking_form.html"><i class="bi bi-calendar-event"></i> Bookings</a>
        <a href="recommendation.html" class="active">
            <i class="bi bi-stars"></i> AI Recommendations
        </a>

        <a href="#"><i class="bi bi-graph-up"></i> Analytics</a>
        <a href="index.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <input type="text" class="search-box" placeholder="Search studios...">
                <div id="clock"></div>
            </div>

            <div class="header-right">
                <div><i class="bi bi-bell"></i> <span class="badge">3</span></div>
                <div class="profile" onclick="toggleDropdown()">
                    <i class="bi bi-person-circle"></i> Ajit
                </div>
            </div>
        </div>

        <div class="dropdown" id="dropdown">
            <p>Profile Settings</p>
            <p>Change Password</p>
            <p>Logout</p>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <!-- STATS -->
            <div class="stats">
                <div class="stat-card">
                    <h4>Total Studios</h4>
                    <p id="totalStudios">0</p>
                </div>
                <div class="stat-card">
                    <h4>Top Rated</h4>
                    <p>4.9 ⭐</p>
                </div>
                <div class="stat-card">
                    <h4>Successful Matches</h4>
                    <p>96%</p>
                </div>
            </div>

            <!-- FILTERS -->
            <div class="filters">
                <select id="event">
                    <option value="Wedding" selected>Wedding</option>
                    <option>Birthday</option>
                    <option>Corporate</option>
                </select>

                <select id="location">
                    <option value="Nagpur" selected>Nagpur</option>
                    <option>Mumbai</option>
                    <option>Pune</option>
                </select>

                <select id="budget">
                    <option value="High" selected>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>


                <button onclick="recommend()">Generate Recommendations</button>
            </div>

            <div class="loader" id="loader">
                <p>AI is analyzing preferences...</p>
            </div>

            <div class="results" id="results"></div>

        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 StudioSync | Intelligent AI Recommendation Platform
        </div>

    </div>

    <script>

        /* ================= DATA ================= */

        const studios = [
            {
                name: "Royal Weddings Studio",
                event: "Wedding",
                location: "Nagpur",
                budget: "High",
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1519741497674-611481863552"
            },
            {
                name: "Dream Lens Photography",
                event: "Wedding",
                location: "Mumbai",
                budget: "Medium",
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac"
            },
            {
                name: "Happy Moments Studio",
                event: "Birthday",
                location: "Nagpur",
                budget: "Low",
                rating: 4.3,
                image: "https://images.unsplash.com/photo-1504198458649-3128b932f49b"
            },
            {
                name: "Elite Corporate Capture",
                event: "Corporate",
                location: "Pune",
                budget: "High",
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1551836022-d5d88e9218df"
            },
            {
                name: "Magic Frames",
                event: "Birthday",
                location: "Mumbai",
                budget: "Medium",
                rating: 4.5,
                image: "https://images.unsplash.com/photo-1513151233558-d860c5398176"
            },
            {
                name: "Grand Royale Weddings",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc"
            },
            {
                name: "Platinum Moments Photography",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1530023367847-a683933f4172"
            },
            {
                name: "Luxury Lens Studio",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1502635385003-ee1e6a1a742d"
            },
            {
                name: "Elite Wedding Frames",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.85,
                image: "https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6"
            },
            {
                name: "Royal Maharaja Studios",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.95,
                image: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30"
            },
            {
                name: "Golden Vows Capture",
                event: "Wedding",
                location: "Mumbai",
                budget: "High",
                rating: 4.75,
                image: "https://images.unsplash.com/photo-1529634891321-36c2f2b7b7f3"
            }

        ];


        /* ================= INITIAL LOAD ================= */

        document.getElementById("totalStudios").innerText = studios.length;

        /* ================= SIDEBAR ================= */

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }

        /* ================= DROPDOWN ================= */

        function toggleDropdown() {
            let d = document.getElementById("dropdown");
            d.style.display = d.style.display === "block" ? "none" : "block";
        }

        /* ================= CLOCK ================= */

        function updateClock() {
            let now = new Date();
            document.getElementById("clock").innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        /* ================= RECOMMENDATION ================= */

        function recommend() {

            const event = document.getElementById("event").value;
            const location = document.getElementById("location").value;
            const budget = document.getElementById("budget").value;

            const loader = document.getElementById("loader");
            const results = document.getElementById("results");

            results.innerHTML = "";
            loader.style.display = "block";

            setTimeout(() => {

                loader.style.display = "none";

                const filtered = studios.filter(s =>
                    (!event || s.event === event) &&
                    (!location || s.location === location) &&
                    (!budget || s.budget === budget)
                ).sort((a, b) => b.rating - a.rating);

                if (filtered.length === 0) {
                    results.innerHTML = `
        <div style="padding:20px; text-align:center;">
            <h3>No Exact Match Found</h3>
            <p>Showing top-rated studios instead.</p>
        </div>
    `;

                    studios
                        .sort((a, b) => b.rating - a.rating)
                        .slice(0, 3)
                        .forEach(s => {
                            results.innerHTML += `
                <div class="card" style="background-image:url('${s.image}')">
                    <div class="card-overlay">
                        <h4>${s.name}</h4>
                        <span class="location-badge">${s.location}</span>
                        <div class="rating">⭐ ${s.rating}</div>
                    </div>
                </div>
            `;
                        });

                    return;
                }


                filtered.forEach(s => {

                    let budgetClass = "";
                    if (s.budget === "High") budgetClass = "budget-high";
                    if (s.budget === "Medium") budgetClass = "budget-medium";
                    if (s.budget === "Low") budgetClass = "budget-low";

                    results.innerHTML += `
        <div class="card" style="background-image:url('${s.image}')">
            <div class="card-overlay">
                <h4>${s.name}</h4>
                <span class="location-badge">${s.location}</span>
                <span class="location-badge ${budgetClass}">${s.budget}</span>
                <div>Event: ${s.event}</div>
                <div class="rating">⭐ ${s.rating}</div>
            </div>
        </div>
    `;
                });


            }, 1500);
        }

    </script>

</body>

</html>
